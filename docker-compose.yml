name: okututor
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-okututor}
      POSTGRES_USER: ${DB_USER:-okututor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-okututor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okututor -d okututor"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-okututor}
      DB_USER: ${DB_USER:-okututor}
      DB_PASSWORD: ${DB_PASSWORD:-okututor}
      JWT_SECRET: ${JWT_SECRET:-change-me-0123456789abcdef}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
