name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: okututor_test
          POSTGRES_USER: okututor
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        working-directory: backend
        run: ./mvnw test -B
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/okututor_test
          DATABASE_USERNAME: okututor
          DATABASE_PASSWORD: testpassword
          JWT_SECRET: test-secret-key-for-ci-at-least-32-chars

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        working-directory: backend
        run: ./mvnw package -DskipTests -B
