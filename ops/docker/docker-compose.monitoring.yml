name: okututor-monitoring

networks:
  okututor:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=30d","--web.enable-lifecycle"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [okututor]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-lokiexplore-app
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [okututor]
    restart: unless-stopped
    depends_on: [prometheus, loki, tempo]

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports: ["3100:3100"]
    networks: [okututor]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports: ["3200:3200","4317:4317","4318:4318"]
    networks: [okututor]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.3.0
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [okututor]
    restart: unless-stopped
    depends_on: [loki, tempo]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    networks: [okututor]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports: ["9100:9100"]
    networks: [okututor]
    restart: unless-stopped
    volumes: ["/proc:/host/proc:ro","/sys:/host/sys:ro","/:/rootfs:ro"]
    command: ["--path.procfs=/host/proc","--path.rootfs=/rootfs","--path.sysfs=/host/sys","--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    networks: [okututor]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.64.0
    environment: { REDIS_ADDR: "redis://redis:6379", REDIS_PASSWORD: "${REDIS_PASSWORD:-}" }
    networks: [okututor]
    restart: unless-stopped
  # TG бот теперь Java-монолит в backend (legal.bot.TgHealthBotService) — python tg-healthbot deprecated, оставлен в ops/docker/tg-healthbot как архив
