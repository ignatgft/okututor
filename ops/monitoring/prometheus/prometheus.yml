global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    app: okututor

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: okututor-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 5s
    # backend в prod защищён auth — Basic Auth через внутренний файл htpasswd или bearer
    # В Dokploy сети `okututor` backend доступен как http://backend:8080
    static_configs: [{ targets: ["backend:8080"] }]
    # если нужен Basic Auth — раскомментируй:
    # basic_auth:
    #   username: ${PROMETHEUS_BACKEND_USER:-prom}
    #   password: ${PROMETHEUS_BACKEND_PASS:-change-me}

  - job_name: node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: postgres-exporter
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: redis-exporter
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
