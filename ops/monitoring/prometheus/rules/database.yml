groups:
  - name: database
    interval: 15s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Postgres down" }

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / pg_settings_max_connections > 0.85
        for: 5m
        labels: { severity: warning }

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_statements_total_time_seconds[5m]) > 1
        for: 5m
        labels: { severity: warning }

      - alert: PostgresLocks
        expr: pg_locks_count > 50
        for: 5m
        labels: { severity: warning }
