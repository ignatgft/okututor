groups:
  - name: infra
    interval: 15s
    rules:
      - alert: DiskCritical
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes * 100) > 90
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Disk >90% on {{ $labels.mountpoint }}" }

      - alert: DiskWarning
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes * 100) > 80
        for: 5m
        labels: { severity: warning }

      - alert: HighCPU
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels: { severity: warning }

      - alert: HighMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 5m
        labels: { severity: warning }

      - alert: ContainerCrashLoop
        expr: increase(container_last_seen[5m]) == 0
        for: 2m
        labels: { severity: critical }

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels: { severity: critical }
