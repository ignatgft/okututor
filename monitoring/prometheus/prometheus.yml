global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: production
    app: okututor

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: okututor-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 5s
    # If backend is in same Dokploy host but separate compose, use host.docker.internal or
    # the backend's Dokploy network alias / public HTTPS.
    # For single-host same network: backend:8080 (add backend to monitoring network externally).
    # For separate hosts: https://api.okututor.com (requires auth) — edit README override.
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: okututor-backend
    # Uncomment if backend /actuator/prometheus is protected by BasicAuth:
    # basic_auth:
    #   username: "prom"
    #   password: "change-me"

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager

  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
