groups:
  - name: okututor-availability
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up{job="okututor-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: okututor-backend
        annotations:
          summary: "🔴 Бэкенд OkuTutor недоступен"
          description: "Бэкенд не отвечает более 2 минут. Требуется срочная проверка."

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          service: prometheus
        annotations:
          summary: "🔴 Prometheus недоступен"
          description: "Сервис мониторинга Prometheus не отвечает более 2 минут. Метрики не собираются."

  - name: okututor-errors
    interval: 30s
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) 
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: okututor-backend
        annotations:
          summary: "🔴 Высокая доля ошибок 5xx (>5% за 5 минут)"
          description: "Доля ответов 5xx составляет {{ $value | humanizePercentage }} за 5 минут. Проверьте логи бэкенда."

      - alert: BackendElevated4xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"4.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "🟡 Повышенная доля ошибок 4xx (>20% за 10 минут)"
          description: "Доля ответов 4xx превышает 20% за 10 минут. Возможны проблемы с клиентами или валидацией."

  - name: okututor-latency
    interval: 30s
    rules:
      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "🟡 Высокая задержка p95 (>1 сек за 5 минут)"
          description: "Задержка p95 составляет {{ $value }} сек. Проверьте производительность БД и внешние зависимости."

  - name: okututor-jvm
    interval: 30s
    rules:
      - alert: JvmHeapHigh
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "🟡 Высокое потребление памяти JVM heap (>85% за 5 минут)"
          description: "Heap JVM заполнен более чем на 85%. Риск OOM — проверьте утечки памяти и нагрузку."

      - alert: JvmGcOverhead
        expr: |
          increase(jvm_gc_pause_seconds_sum[5m]) > 3
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "🟡 Высокая нагрузка сборщика мусора JVM (GC pause >3 сек)"
          description: "Суммарные паузы GC превысили 3 сек за 5 минут. Возможна деградация производительности."

  - name: okututor-database
    interval: 30s
    rules:
      - alert: DbPoolExhaustion
        expr: |
          (hikaricp_connections_active / hikaricp_connections_max) > 0.85
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "🟡 Пул соединений БД почти исчерпан (>85% за 5 минут)"
          description: "Активных соединений >85% от максимума. Проверьте долгие транзакции и настройки пула."

      - alert: DbPoolPendingHigh
        expr: |
          hikaricp_connections_pending > 5
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "🟡 Очередь ожидания соединений БД (>5 потоков)"
          description: "Более 5 потоков ожидают соединения к БД. Возможна блокировка или нехватка коннектов."

  - name: okututor-monitoring
    interval: 30s
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: warning
          service: loki
        annotations:
          summary: "🟡 Loki недоступен"
          description: "Сервис сбора логов Loki не отвечает более 2 минут. Логи могут не сохраняться."
