groups:
  - name: okututor-availability
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up{job="okututor-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: okututor-backend
        annotations:
          summary: "OkuTutor backend is DOWN"
          description: "Backend instance has been down for more than 2 minutes."

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          service: prometheus
        annotations:
          summary: "Prometheus is DOWN"

  - name: okututor-errors
    interval: 30s
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) 
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: okututor-backend
        annotations:
          summary: "High 5xx error rate (>5% for 5m)"
          description: "5xx rate is {{ $value | humanizePercentage }} for 5 minutes."

      - alert: BackendElevated4xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"4.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "Elevated 4xx rate (>20% for 10m)"

  - name: okututor-latency
    interval: 30s
    rules:
      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "High p95 latency (>1s for 5m)"
          description: "p95 latency is {{ $value }}s"

  - name: okututor-jvm
    interval: 30s
    rules:
      - alert: JvmHeapHigh
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "JVM heap usage >85% for 5m"

      - alert: JvmGcOverhead
        expr: |
          increase(jvm_gc_pause_seconds_sum[5m]) > 3
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "JVM GC pause overhead high"

  - name: okututor-database
    interval: 30s
    rules:
      - alert: DbPoolExhaustion
        expr: |
          (hikaricp_connections_active / hikaricp_connections_max) > 0.85
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "DB connection pool >85% active for 5m"

      - alert: DbPoolPendingHigh
        expr: |
          hikaricp_connections_pending > 5
        for: 5m
        labels:
          severity: warning
          service: okututor-backend
        annotations:
          summary: "DB pool pending connections >5"

  - name: okututor-monitoring
    interval: 30s
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: warning
          service: loki
        annotations:
          summary: "Loki is DOWN"
