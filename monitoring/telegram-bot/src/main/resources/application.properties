server.port=8085
server.address=0.0.0.0

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:okututor_monitoring_bot}
telegram.chat.id=${TELEGRAM_CHAT_ID:}
telegram.allowed.chat.ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
telegram.environment=${TELEGRAM_ENVIRONMENT:production}
alertmanager.url=${ALERTMANAGER_URL:http://alertmanager:9093}
grafana.url=${GRAFANA_EXTERNAL_URL:${GRAFANA_URL:http://grafana:3000}}

# no actuator needed, but disable banner
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.com.okututor=INFO
