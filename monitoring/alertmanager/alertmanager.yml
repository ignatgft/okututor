global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram
  routes:
    - match:
        severity: critical
      receiver: telegram
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: telegram
      repeat_interval: 2h

receivers:
  - name: telegram
    webhook_configs:
      - url: "http://telegram-bot:8085/alert"
        send_resolved: true
        max_alerts: 10
        http_config:
          follow_redirects: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]
