name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'monitoring/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'monitoring/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: okututor_test
          POSTGRES_USER: okututor
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        working-directory: backend
        run: ./mvnw test -B -DfailIfNoTests=false
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/okututor_test
          DATABASE_USERNAME: okututor
          DATABASE_PASSWORD: testpassword
          JWT_SECRET: test-secret-key-for-ci-at-least-32-chars
      - name: Verify single monitoring compose
        run: docker compose -f monitoring/docker-compose.yml config -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        working-directory: backend
        run: ./mvnw package -DskipTests -B
      - name: Docker build (smoke)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: okututor-backend:ci
      - name: Trivy scan (fs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy (VPS#2 App)
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" "${{ secrets.DOKPLOY_WEBHOOK_URL }}" || echo "Dokploy webhook failed"
          else
            echo "DOKPLOY_WEBHOOK_URL not set — skip deploy (manual in Dokploy)"
          fi
      - name: Healthcheck after deploy (smoke)
        run: |
          echo "Waiting 30s for app to start..."
          sleep 30
          curl -f https://api.okututor.kg/actuator/health/ready || echo "Healthcheck skipped (no prod URL)"
      - name: Rollback hint
        if: failure()
        run: echo "Deploy failed — rollback in Dokploy → Previous Deployment → Redeploy"
