# PRODUCTION-профиль: строгая конфигурация без dev-дефолтов.
# Все обязательные значения приходят ТОЛЬКО из окружения; при отсутствии
# критичных переменных приложение не стартует (см. ProdEnvValidator).

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}${DB_URL_PARAMS:}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 280000
      keepalive-time: 30000
      validation-timeout: 1000

app:
  jwt:
    # пустой дефолт обязателен: иначе неразрешённый плейсхолдер свяжется как
    # литерал "${JWT_SECRET}"; отсутствие значения ловит ProdEnvValidator
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}
  frontend-url: ${FRONTEND_URL:}
  livekit:
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    ws-url: ${LIVEKIT_WS_URL:}
  mail:
    enabled: true
    from: ${MAIL_FROM:}
  seed:
    # production никогда не создаёт демо-аккаунты, независимо от ENV
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # health для probe; prometheus — метрики, снимаемые мониторингом (сеть обычно закрыта)
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${OKUTUTOR_ENV:production}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLING:0.1}

# в prod JSON-логи включены по умолчанию (Loki); отключается через SPRING_PROFILES_ACTIVE=prod без jsonlog
# см. logback-spring.xml — профиль jsonlog переключает appender на JsonEncoder.

logging:
  level:
    com.okututor.backend: INFO
    org.hibernate.SQL: WARN
