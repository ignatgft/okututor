groups:
  - name: business
    interval: 30s
    rules:
      - alert: HighModerationQueue
        expr: okututor_moderation_pending > 50
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Moderation queue >50" }

      - alert: SearchNoResultsHigh
        expr: rate(okututor_tutor_search_no_results_total[15m]) > 0.3
        for: 10m
        labels: { severity: warning }

      - alert: ReviewsStalled
        expr: increase(okututor_reviews_created_total[1h]) == 0
        for: 0m
        labels: { severity: info }
