global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram
  routes:
    - match: { severity: critical }
      receiver: telegram-critical
      repeat_interval: 15m
    - match: { severity: warning }
      receiver: telegram-warning
      repeat_interval: 2h

inhibit_rules:
  - source_match: { severity: critical }
    target_match: { severity: warning }
    equal: ["alertname"]

receivers:
  - name: telegram
    webhook_configs:
      - url: "http://backend:8080/api/v1/telegram/alert"
        send_resolved: true
        max_alerts: 10

  - name: telegram-critical
    webhook_configs:
      - url: "http://backend:8080/api/v1/telegram/alert?severity=critical"
        send_resolved: true

  - name: telegram-warning
    webhook_configs:
      - url: "http://backend:8080/api/v1/telegram/alert?severity=warning"
        send_resolved: true

# Dedup + cooldown обеспечивается tg-healthbot (grouping + 15m suppress)
